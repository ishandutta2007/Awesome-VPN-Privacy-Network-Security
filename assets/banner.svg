<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="100%" height="340">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#080b14" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.4" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <radialGradient id="pulse1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="pulse2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="340" rx="16" fill="url(#bgGradient)" />
  <rect width="1198" height="338" x="1" y="1" rx="15" fill="none" stroke="#38bdf8" stroke-opacity="0.2" stroke-width="1.5" />

  <!-- Dynamic ambient glowing orbs behind foreground -->
  <circle cx="220" cy="80" r="160" fill="url(#pulse1)">
    <animate attributeName="cx" values="200;260;200" dur="9s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.6;0.9;0.6" dur="9s" repeatCount="indefinite" />
  </circle>
  <circle cx="980" cy="220" r="200" fill="url(#pulse2)">
    <animate attributeName="cx" values="980;920;980" dur="11s" repeatCount="indefinite" />
    <animate attributeName="opacity" values="0.5;0.8;0.5" dur="11s" repeatCount="indefinite" />
  </circle>

  <!-- Network Grid Nodes & Animated Connecting Lines in Background -->
  <g opacity="0.28" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4 4">
    <line x1="100" y1="280" x2="280" y2="220">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="280" y1="220" x2="440" y2="270">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="780" y1="280" x2="920" y2="230">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="4s" repeatCount="indefinite" />
    </line>
    <line x1="920" y1="230" x2="1080" y2="260">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="5s" repeatCount="indefinite" />
    </line>
    <line x1="280" y1="220" x2="320" y2="90">
      <animate attributeName="stroke-dashoffset" values="0;32" dur="6s" repeatCount="indefinite" />
    </line>
    <line x1="920" y1="230" x2="880" y2="80">
      <animate attributeName="stroke-dashoffset" values="32;0" dur="6s" repeatCount="indefinite" />
    </line>
  </g>

  <!-- Background Data Flow Packets -->
  <g fill="#38bdf8" opacity="0.7">
    <circle r="3">
      <animateMotion path="M100,280 L280,220 L440,270" dur="5s" repeatCount="indefinite" />
    </circle>
    <circle r="3">
      <animateMotion path="M1080,260 L920,230 L780,280" dur="6s" repeatCount="indefinite" />
    </circle>
  </g>

  <!-- Decorative Circuit Nodes -->
  <circle cx="100" cy="280" r="4" fill="#38bdf8" opacity="0.6" />
  <circle cx="280" cy="220" r="5" fill="#818cf8" opacity="0.7" />
  <circle cx="440" cy="270" r="4" fill="#38bdf8" opacity="0.6" />
  <circle cx="780" cy="280" r="4" fill="#a855f7" opacity="0.6" />
  <circle cx="920" cy="230" r="5" fill="#818cf8" opacity="0.7" />
  <circle cx="1080" cy="260" r="4" fill="#38bdf8" opacity="0.6" />

  <!-- Central Shield Icon (Foreground) -->
  <g transform="translate(600, 78) translate(-28, -28)">
    <path d="M28 2 L50 11 V26 C50 39.5 40.5 50.8 28 54 C15.5 50.8 6 39.5 6 26 V11 Z" fill="url(#shieldGrad)" stroke="#38bdf8" stroke-width="2.5" filter="url(#glow)">
      <animate attributeName="transform" type="scale" values="1; 1.05; 1" keyTimes="0; 0.5; 1" dur="4s" repeatCount="indefinite" transform-origin="28 28" />
    </path>
    <!-- Keyhole/Lock in Shield -->
    <path d="M28 20 C25.8 20 24 21.8 24 24 C24 25.5 24.8 26.8 26 27.5 L25 35 H31 L30 27.5 C31.2 26.8 32 25.5 32 24 C32 21.8 30.2 20 28 20 Z" fill="#ffffff" />
  </g>

  <!-- Foreground Title and Headings -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Main Title -->
    <text x="600" y="162" font-size="36" font-weight="800" fill="url(#accentGrad)" letter-spacing="0.5">
      Awesome VPN, Privacy &amp; Network Security
    </text>

    <!-- Subtitle -->
    <text x="600" y="200" font-size="16" font-weight="500" fill="#94a3b8" letter-spacing="0.3">
      Curated Zero-Trust Mesh Overlays • DPI Obfuscation • WireGuard / OpenVPN Protocols • Sovereign Gateways
    </text>

    <!-- Foreground Category Badges / Pills -->
    <g transform="translate(0, 242)">
      <!-- Pill 1 -->
      <g transform="translate(190, 0)">
        <rect width="170" height="34" rx="17" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.2" />
        <circle cx="22" cy="17" r="5" fill="#38bdf8" />
        <text x="95" y="22" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">WireGuard &amp; Mesh</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(380, 0)">
        <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.2" />
        <circle cx="22" cy="17" r="5" fill="#818cf8" />
        <text x="105" y="22" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Anti-DPI Obfuscation</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(590, 0)">
        <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.2" />
        <circle cx="22" cy="17" r="5" fill="#c084fc" />
        <text x="105" y="22" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">Zero-Trust &amp; Privacy</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(800, 0)">
        <rect width="190" height="34" rx="17" fill="#1e293b" stroke="#34d399" stroke-opacity="0.4" stroke-width="1.2" />
        <circle cx="22" cy="17" r="5" fill="#34d399" />
        <text x="105" y="22" font-size="12" font-weight="600" fill="#e2e8f0" text-anchor="middle">DNS &amp; Onion Routing</text>
      </g>
    </g>
  </g>
</svg>
